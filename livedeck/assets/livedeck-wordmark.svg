</g>
<text x="194" y="108" font-family="Segoe UI, Yu Gothic UI, Meiryo UI, sans-serif" font-size="82" font-weight="800" letter-spacing="-4" fill="#10284d">Live<tspan fill="url(#deck)">Deck</tspan></text>
