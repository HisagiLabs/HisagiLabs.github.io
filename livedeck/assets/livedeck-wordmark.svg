  <linearGradient id="tileB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fa0ff"/><stop offset="1" stop-color="#3975e2"/></linearGradient>
  <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b79f0"/><stop offset="1" stop-color="#0d94ff"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1a4e9f" flood-opacity=".16"/></filter>
</defs>
<g transform="translate(8 10)" filter="url(#soft)">
